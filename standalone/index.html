<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroll Car Animation</title>
    <!-- GSAP and ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        overflow-x: hidden;
        background-color: #d1d1d1;
        color: #111;
      }
      .section {
        height: 240vh;
        position: relative;
        background: #d1d1d1;
      }
      .track {
        position: sticky;
        top: 0;
        height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #d1d1d1;
        overflow: hidden;
      }
      .road {
        width: 100vw;
        height: 200px;
        background-color: #1e1e1e;
        position: relative;
        overflow: hidden;
      }
      .car {
        height: 200px;
        width: auto;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 10;
        pointer-events: none;
        will-change: transform;
      }
      .trail {
        height: 200px;
        background: #45db7d;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 2;
        width: 45px;
      }
      .value-add {
        position: absolute;
        left: 5%;
        top: 50%;
        transform: translateY(-50%);
        z-index: 5;
        display: flex;
        gap: 0.35rem;
        pointer-events: none;
        white-space: nowrap;
      }
      .value-letter {
        color: #111;
        opacity: 0;
        font-weight: 900;
        font-size: clamp(3.5rem, 8vw, 7.5rem);
        line-height: 1;
        transition: opacity 0.15s ease;
      }
      .text-box {
        opacity: 0;
        padding: 24px 28px;
        border-radius: 12px;
        position: absolute;
        z-index: 20;
        display: flex;
        flex-direction: column;
        justify-content: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        min-width: 220px;
        max-width: 260px;
      }
      .num-box {
        font-size: 56px;
        font-weight: 700;
        line-height: 1;
      }
      .box-desc {
        font-size: 16px;
        font-weight: 500;
        margin-top: 8px;
        line-height: 1.25;
      }
      #box1 {
        background: #def54f;
        color: #111;
        top: 6%;
        right: 32%;
      }
      #box2 {
        background: #56b4f7;
        color: #111;
        bottom: 6%;
        right: 35%;
      }
      #box3 {
        background: #2b2d30;
        color: #fff;
        top: 6%;
        right: 10%;
      }
      #box4 {
        background: #fa7328;
        color: #111;
        bottom: 6%;
        right: 12%;
      }

      /* Floating Control Dock */
      .dock {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        display: flex;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 9999px;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(12px);
        box-shadow: 0 15px 30px rgba(0,0,0,0.25);
      }
      .dock-btn {
        border: none;
        outline: none;
        padding: 8px 16px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        transition: all 0.2s ease;
      }
      .dock-btn:hover {
        background: rgba(255, 255, 255, 0.28);
      }
      .dock-btn.active {
        background: #45db7d;
        color: #000;
      }
    </style>
  </head>
  <body>
    <!-- Floating Quick Control Dock -->
    <div class="dock">
      <button class="dock-btn" onclick="goToStart()">📍 Start Point</button>
      <button class="dock-btn" onclick="goToFinal()">🏁 Final Point</button>
      <button class="dock-btn" id="autoBtn" onclick="toggleAutoDrive()">▶️ Auto Drive</button>
    </div>

    <div class="section">
      <div class="track">
        <div class="road" id="road">
          <!-- McLaren 720S Sports Car Top View Asset -->
          <img
            src="./car.png"
            alt="McLaren 720S"
            class="car"
            id="car"
          />
          <div class="trail" id="trail"></div>
          <div class="value-add" id="valueText">
            <span class="value-letter">W</span>
            <span class="value-letter">E</span>
            <span class="value-letter">L</span>
            <span class="value-letter">C</span>
            <span class="value-letter">O</span>
            <span class="value-letter">M</span>
            <span class="value-letter">E</span>
            <span class="value-letter">&nbsp;</span>
            <span class="value-letter">I</span>
            <span class="value-letter">T</span>
            <span class="value-letter">Z</span>
            <span class="value-letter">F</span>
            <span class="value-letter">I</span>
            <span class="value-letter">Z</span>
            <span class="value-letter">Z</span>
          </div>
        </div>

        <!-- 4 Statistics Text Boxes matching Picture 2 -->
        <div class="text-box" id="box1">
          <span class="num-box">58%</span>
          <span class="box-desc">Increase in pick up point use</span>
        </div>
        <div class="text-box" id="box2">
          <span class="num-box">23%</span>
          <span class="box-desc">Decreased in customer phone calls</span>
        </div>
        <div class="text-box" id="box3">
          <span class="num-box">27%</span>
          <span class="box-desc">Increase in pick up point use</span>
        </div>
        <div class="text-box" id="box4">
          <span class="num-box">40%</span>
          <span class="box-desc">Decreased in customer phone calls</span>
        </div>
      </div>
    </div>

    <script>
      gsap.registerPlugin(ScrollTrigger);

      const car = document.getElementById("car");
      const trail = document.getElementById("trail");
      const letters = gsap.utils.toArray(".value-letter");
      const road = document.getElementById("road");
      const boxes = [
        { el: document.getElementById("box1"), start: 0.15, end: 0.35 },
        { el: document.getElementById("box2"), start: 0.35, end: 0.55 },
        { el: document.getElementById("box3"), start: 0.55, end: 0.75 },
        { el: document.getElementById("box4"), start: 0.75, end: 0.95 },
      ];

      function setupScroll() {
        const roadRect = road.getBoundingClientRect();
        const roadWidth = window.innerWidth;
        const carWidth = car.offsetWidth || 419;
        // In Picture 2, only rear ~145px is visible at the right edge
        const endX = Math.max(roadWidth - 145, 100);

        const letterRects = letters.map((letter) => {
          const rect = letter.getBoundingClientRect();
          return rect.left - roadRect.left;
        });

        ScrollTrigger.getById("carMainTrigger")?.kill();

        gsap.to(car, {
          id: "carMainTrigger",
          scrollTrigger: {
            trigger: ".section",
            start: "top top",
            end: "bottom bottom",
            scrub: 1.0,
            pin: ".track",
            onUpdate: function (self) {
              const progress = self.progress;
              const currentX = gsap.getProperty(car, "x") || 0;
              const carMidpoint = currentX + carWidth * 0.45;

              // Trail
              if (progress >= 0.96) {
                gsap.set(trail, { width: roadWidth });
              } else {
                gsap.set(trail, { width: Math.max(currentX + 45, 45) });
              }

              // Letters reveal
              letters.forEach((letter, i) => {
                if (progress > 0.02 && carMidpoint >= letterRects[i]) {
                  letter.style.opacity = 1;
                } else {
                  letter.style.opacity = 0;
                }
              });

              // 4 Stat boxes
              boxes.forEach(({ el, start, end }) => {
                const op = gsap.utils.clamp(0, 1, (progress - start) / (end - start));
                gsap.set(el, { opacity: op });
              });
            },
          },
          x: endX,
          ease: "none",
        });
      }

      window.addEventListener("load", setupScroll);
      window.addEventListener("resize", setupScroll);

      function goToStart() {
        stopAuto();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function goToFinal() {
        stopAuto();
        window.scrollTo({ top: window.innerHeight * 1.4, behavior: "smooth" });
      }

      let autoInterval = null;
      function toggleAutoDrive() {
        if (autoInterval) {
          stopAuto();
        } else {
          document.getElementById("autoBtn").innerText = "⏸️ Pause";
          autoInterval = setInterval(() => {
            const target = window.innerHeight * 1.4;
            if (window.scrollY >= target) {
              stopAuto();
            } else {
              window.scrollBy({ top: 6, behavior: "auto" });
            }
          }, 16);
        }
      }

      function stopAuto() {
        if (autoInterval) {
          clearInterval(autoInterval);
          autoInterval = null;
          document.getElementById("autoBtn").innerText = "▶️ Auto Drive";
        }
      }
    </script>
  </body>
</html>
